<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b3448"/>
      <stop offset="1" stop-color="#12161f"/>
    </linearGradient>
    <radialGradient id="body" cx="0.35" cy="0.28" r="0.85">
      <stop offset="0" stop-color="#5b9dff"/>
      <stop offset="0.55" stop-color="#2f6ff0"/>
      <stop offset="1" stop-color="#1d4fc4"/>
    </radialGradient>
    <linearGradient id="mouth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b0e18"/>
      <stop offset="1" stop-color="#1a1230"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e9eef8"/>
    </linearGradient>
    <clipPath id="mouthClip">
      <ellipse cx="548" cy="708" rx="238" ry="138"/>
    </clipPath>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <!-- background tile -->
  <rect width="1024" height="1024" rx="226" fill="url(#bg)"/>

  <!-- ambient glow behind the monster -->
  <ellipse cx="512" cy="600" rx="360" ry="330" fill="#2563eb" opacity="0.28" filter="url(#soft)"/>

  <!-- feet -->
  <ellipse cx="420" cy="882" rx="78" ry="44" fill="#1d4fc4"/>
  <ellipse cx="612" cy="882" rx="78" ry="44" fill="#1d4fc4"/>

  <!-- horns -->
  <path d="M424 272 C438 196 458 162 474 160 C490 162 506 210 512 266 Z" fill="#5b9dff"/>
  <path d="M520 254 C532 176 546 142 556 140 C568 142 586 200 594 252 Z" fill="#5b9dff"/>

  <!-- body -->
  <circle cx="512" cy="562" r="332" fill="url(#body)"/>

  <!-- mouth cavity -->
  <ellipse cx="548" cy="708" rx="238" ry="138" fill="url(#mouth)"/>
  <!-- tongue -->
  <ellipse cx="560" cy="800" rx="150" ry="78" fill="#ef4c78" clip-path="url(#mouthClip)"/>
  <ellipse cx="530" cy="790" rx="60" ry="30" fill="#ff7c9d" opacity="0.7" clip-path="url(#mouthClip)"/>

  <!-- the envelope going in -->
  <g transform="translate(748 612) rotate(-28)">
    <rect x="-172" y="-112" width="344" height="224" rx="18" fill="url(#paper)"/>
    <path d="M-150 -92 L0 22 L150 -92" fill="none" stroke="#2563eb" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M-150 92 L-40 -6 M150 92 L40 -6" fill="none" stroke="#c9d6f2" stroke-width="10" stroke-linecap="round"/>
  </g>

  <!-- shade the part of the envelope that is already inside the mouth -->
  <ellipse cx="548" cy="708" rx="238" ry="138" fill="#0b0e18" opacity="0.42"/>

  <!-- upper teeth -->
  <g fill="#ffffff">
    <path d="M356 602 L392 682 L428 604 Z"/>
    <path d="M446 586 L484 674 L522 586 Z"/>
    <path d="M540 582 L578 672 L616 582 Z"/>
    <path d="M634 594 L670 680 L706 596 Z"/>
    <path d="M722 620 L748 692 L774 626 Z"/>
  </g>
  <!-- lower teeth -->
  <g fill="#ffffff">
    <path d="M430 836 L456 776 L482 836 Z"/>
    <path d="M620 838 L646 780 L672 838 Z"/>
  </g>

  <!-- eyes -->
  <circle cx="418" cy="438" r="74" fill="#ffffff"/>
  <circle cx="626" cy="420" r="96" fill="#ffffff"/>
  <circle cx="436" cy="446" r="36" fill="#12161f"/>
  <circle cx="650" cy="430" r="46" fill="#12161f"/>
  <circle cx="450" cy="432" r="11" fill="#ffffff"/>
  <circle cx="668" cy="412" r="14" fill="#ffffff"/>

  <!-- cheek blush -->
  <ellipse cx="318" cy="560" rx="42" ry="24" fill="#ff8fb0" opacity="0.45"/>
</svg>
