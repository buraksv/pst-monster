name: Release

# Every push to main becomes a release:
#   1. "version" works out which number this release gets. It only reads; it
#      writes nothing to the repository.
#   2. The three build pipelines package that commit, one per operating system,
#      with the chosen version stamped into it.
#   3. "publish" runs only once all three have succeeded. It commits the version
#      to main, then creates the GitHub Release with the installers attached.
#      Creating the release is what creates the tag.
#
# Nothing is tagged before the packages exist, so a failed build leaves the
# repository exactly as it was: no orphaned tag, no version number burned, and
# nothing half-finished on the Releases page.
#
# Old releases are never touched. The minor version moves on its own; to cut a
# major version, set it in package.json by hand (for example 2.0.0) and push,
# or run this workflow manually and choose "major".
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.github/workflows/ci.yml'
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version to raise
        type: choice
        required: true
        default: auto
        options: [auto, minor, major, patch]

# One release at a time. A second push waits instead of racing for the number.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  version:
    name: Decide the version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.version }}
      tag: ${{ steps.next.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The whole history, so the script can see which versions are tagged.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Work out the next version
        id: next
        run: |
          set -euo pipefail
          BUMP="${{ github.event.inputs.bump || 'auto' }}"
          NEXT="$(node scripts/next-version.mjs "$BUMP")"
          CURRENT="$(node -p "require('./package.json').version")"
          echo "current $CURRENT -> next $NEXT ($BUMP)"
          echo "version=$NEXT" >> "$GITHUB_OUTPUT"
          echo "tag=v$NEXT" >> "$GITHUB_OUTPUT"

  linux:
    needs: version
    uses: ./.github/workflows/build-linux.yml
    with:
      ref: ${{ github.sha }}
      version: ${{ needs.version.outputs.version }}

  windows:
    needs: version
    uses: ./.github/workflows/build-windows.yml
    with:
      ref: ${{ github.sha }}
      version: ${{ needs.version.outputs.version }}

  macos:
    needs: version
    uses: ./.github/workflows/build-macos.yml
    with:
      ref: ${{ github.sha }}
      version: ${{ needs.version.outputs.version }}

  publish:
    name: Publish the GitHub Release
    needs: [version, linux, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main

      - name: Collect the packages from all three builds
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Check what came back and add checksums
        run: |
          set -euo pipefail
          cd dist
          rm -f builder-debug.yml
          # Refuse to publish a release that is missing an operating system.
          for pattern in '*.exe' '*.dmg' '*.deb' '*.AppImage' '*.tar.gz'; do
            if ! compgen -G "$pattern" > /dev/null; then
              echo "no file matching $pattern; not publishing an incomplete release"
              exit 1
            fi
          done
          sha256sum * > SHA256SUMS.txt
          ls -la

      - name: Record the version in package.json on main
        id: commit
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          if git diff --quiet; then
            echo "package.json already at $VERSION"
          else
            git commit -am "chore(release): v$VERSION [skip ci]"
            git push origin HEAD:main
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Write the release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          set -euo pipefail
          # The download table, so a reader can tell which of the nine files is
          # for their machine without decoding "macos-arm64" for themselves.
          node scripts/release-notes.mjs dist "$VERSION" > notes.md
          # GitHub's own "what changed" list, appended under it. It is a nicety:
          # if the API cannot produce one, the release still goes out.
          if gh api "repos/${{ github.repository }}/releases/generate-notes" \
              -f tag_name="$TAG" -f target_commitish="$SHA" --jq .body > generated.md 2>/dev/null; then
            printf '\n---\n\n' >> notes.md
            cat generated.md >> notes.md
          else
            echo "could not generate the change list; publishing with the table only"
          fi
          cat notes.md

      - name: Create the release and its tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          set -euo pipefail
          # Every built package becomes a release asset. gh creates the tag at
          # --target, so the tag and the release appear together: there is no
          # window where a tag exists with nothing attached to it.
          gh release create "$TAG" dist/* \
            --title "PST Monster v$VERSION" \
            --target "$SHA" \
            --notes-file notes.md \
            --latest
