name: Build macOS

# Builds the macOS packages for the version currently in package.json and
# attaches them to that version's GitHub Release.
#
# Run this by hand from the Actions tab. The release is created as a draft if it
# does not exist yet, and is published automatically once all three operating
# systems have their packages in it. Re-running replaces this system's files
# rather than adding duplicates.
#
# To ship a new version, run Increase minor version (or major) first, then run
# the three build pipelines.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit, branch or tag to build
        type: string
        required: false
        default: main
  workflow_call:
    inputs:
      ref:
        description: Commit or tag to build
        type: string
        required: false
        default: main

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Package
        run: npx electron-builder --mac --publish never
        env:
          # No signing certificate: ship unsigned rather than fail the build.
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Attach the packages to this version's release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          mkdir -p upload
          cp release/*.dmg release/*.zip  upload/
          bash scripts/attach-release-assets.sh upload
      - uses: actions/upload-artifact@v7
        with:
          name: pst-monster-macos
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: error
          # A spare copy in case the upload to the release fails: it saves
          # rebuilding. The release itself is the permanent home.
          retention-days: 7
